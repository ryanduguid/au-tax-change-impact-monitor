[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "au-tax-change-impact-monitor"
version = "0.1.0"
description = "A provenance-first synthetic change-review queue for Australian tax workflow sources"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "tax", "legislation", "provenance", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
au-tax-change-impact-monitor = "au_tax_change_impact_monitor.cli:main"

[tool.setuptools]
packages = ["au_tax_change_impact_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
